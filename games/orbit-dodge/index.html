<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orbit Dodge | SUPER AWESOME ARCADE</title><link rel="icon" href="../../assets/logo.png">
<style>
html,body{margin:0;height:100%;background:#0D0E12;overflow:hidden;touch-action:none;color:#fff;user-select:none;font-family:var(--font,monospace)}
#w{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}canvas{display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0D0E12dd;text-align:center;gap:12px;line-height:1.7}
#no{font-size:9px;color:#777}#t{margin:0;font-size:20px}#tg{font-size:8px;color:#b8b8c0}#info{font-size:10px}#hi{font-size:10px;color:var(--green)}
#cr{font-size:9px;color:var(--green)}#go{font-size:11px;color:var(--pink)}
#sh{padding:10px 14px;background:none;border:2px solid var(--green);color:var(--green);font:9px var(--font);cursor:pointer}
</style></head><body>
<div id="w"><canvas id="c" width="360" height="640"></canvas>
<div id="ov"><div id="no"></div><h1 id="t"></h1><div id="tg"></div><div id="info"></div><div id="hi"></div><div id="cr"></div><div id="go" class="hub-blink">PRESS START</div><button id="sh" hidden>CHALLENGE FRIENDS</button></div></div>
<script src="../../hub.js"></script>
<script>
// ---- THEME BLOCK: the only part that changes per game ----
const T={slug:'orbit-dodge',name:'ORBIT DODGE',no:1,tag:'REVERSE. DODGE. REPEAT.',hazard:HUB.PAL.cyan,player:HUB.B.pink,score:HUB.B.green,bg:HUB.B.bg};
// -----------------------------------------------------------
const G=T.slug,x=c.getContext('2d'),CX=180,CY=320,R=95;
let st='over',a=0,dir=1,t=0,en=[],pa=[],shake=0,sp=0,deadAt=0,last=0,score=0,cd=9,cdT=0;
function fit(){let h=innerHeight,w=h*9/16;if(w>innerWidth){w=innerWidth;h=w*16/9}c.style.width=w+'px';c.style.height=h+'px'}
addEventListener('resize',fit);fit();
const px=()=>CX+Math.cos(a)*R,py=()=>CY+Math.sin(a)*R;
function attract(){no.textContent='No. '+String(T.no).padStart(2,'0');t_.textContent=T.name;t_.style.color=T.hazard;t_.style.textShadow=`3px 3px 0 ${T.player}66`;
  tg.textContent=T.tag;info.textContent=st==='over'&&score?'GAME OVER':'';cr.textContent=HUB.creditsText(G);ov.style.display='flex'}
const t_=document.getElementById('t');
function start(){if(!HUB.canPlay(G)){return}a=0;dir=1;t=0;en=[];pa=[];sp=0;st='play';ov.style.display='none';last=performance.now();HUB.track(G,'round_start')}
HUB.onUnlock=start;
function showOver(){const b=HUB.best(G,score);
  info.innerHTML=`SCORE ${score}`;hi.textContent=`HI ${HUB.ini()||'---'} ${b.best}`;
  go.textContent=`CONTINUE? ${cd}`;sh.hidden=false;cr.textContent=HUB.creditsText(G);no.textContent='';tg.textContent='';t_.textContent='GAME OVER';t_.style.color=T.player;
  setTimeout(()=>{if(st==='over')ov.style.display='flex'},350);
  if(b.isNew&&score>0&&!HUB.ini())setTimeout(()=>HUB.initials(()=>showOver2()),500);
  clearInterval(cdT);cd=9;cdT=setInterval(()=>{if(st!=='over'){clearInterval(cdT);return}cd=Math.max(0,cd-1);go.textContent=cd?`CONTINUE? ${cd}`:'PRESS START'},1000)}
const showOver2=()=>{hi.textContent=`HI ${HUB.ini()} ${HUB.best(G,0).best}`};
function die(){st='over';shake=200;score=Math.floor(t);deadAt=performance.now();
  for(let i=0;i<14;i++){const r=Math.random()*6.28,v=60+Math.random()*120;pa.push({x:px(),y:py(),vx:Math.cos(r)*v,vy:Math.sin(r)*v,l:.6})}
  HUB.track(G,'round_end',score);showOver()}
sh.onclick=e=>{e.stopPropagation();HUB.share(G,T.name,score,sh)};
function tap(e){if(e.target.closest&&e.target.closest('button,.hub-ov'))return;
  if(st==='play')dir*=-1;else if(performance.now()-deadAt>300){sh.hidden=true;start()}}
addEventListener('pointerdown',tap);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap({target:document.body})}});
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;
  if(st==='play'){t+=dt;a+=dir*(2.2+t*.02)*dt;sp-=dt;
    if(sp<=0){sp=Math.max(.35,1.1-t*.015);const r=Math.random()*6.28;en.push({x:CX+Math.cos(r)*420,y:CY+Math.sin(r)*420,tx:CX+(Math.random()-.5)*60,ty:CY+(Math.random()-.5)*60,l:6})}
    en.forEach(o=>{const d=Math.hypot(o.tx-o.x,o.ty-o.y)||1,v=130+t*3;o.x+=(o.tx-o.x)/d*v*dt;o.y+=(o.ty-o.y)/d*v*dt;o.l-=dt;
      if(Math.hypot(o.x-px(),o.y-py())<(9+7)*.85&&st==='play')die()});
    en=en.filter(o=>o.l>0)}
  pa.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});pa=pa.filter(q=>q.l>0);
  x.save();if(shake>0){shake-=dt*1000;x.translate((Math.random()-.5)*8,(Math.random()-.5)*8)}
  x.fillStyle='rgba(13,14,18,.25)';x.fillRect(-10,-10,380,660);
  x.strokeStyle=T.hazard+'30';x.beginPath();x.arc(CX,CY,R,0,6.29);x.stroke();
  x.fillStyle=T.hazard;en.forEach(o=>{x.beginPath();x.arc(o.x,o.y,9,0,6.29);x.fill()});
  x.fillStyle='#fff';pa.forEach(q=>x.fillRect(q.x,q.y,3,3));
  if(st==='play'){x.shadowColor=T.player;x.shadowBlur=12;x.fillStyle=T.player;x.beginPath();x.arc(px(),py(),7,0,6.29);x.fill();x.shadowBlur=0;
    x.fillStyle=T.score;x.font='16px "Press Start 2P",monospace';x.textAlign='center';x.fillText(Math.floor(t),CX,50)}
  HUB.watermark(x,360,640);x.restore();requestAnimationFrame(loop)}
HUB.ready.then(()=>{attract();requestAnimationFrame(loop)});
</script></body></html>
